<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Explicit viewport: the engine usually injects one, but relying on that
       leaves older builds and `flutter run -d chrome` at the 980px default.
       Zoom is deliberately left enabled for accessibility. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SkillBridge Academy — friendly Python learning for every learner.">

  <!-- iOS meta tags & icons. iOS ignores the web manifest for the home-screen
       icon and launch chrome, so these are not optional duplicates. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SkillBridge Academy">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1697F5">

  <!-- Favicon: a dedicated, simplified robot mark that stays crisp at 16-32px.
       The ?v= suffix makes browsers fetch the new icon instead of a cached one;
       bump it whenever the icon changes. -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">

  <title>SkillBridge Academy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background-color: #f7fbff;
    }
    body {
      background:
        linear-gradient(180deg, rgba(247, 251, 255, 0.10) 0%, rgba(247, 251, 255, 0.18) 100%),
        url('https://res.cloudinary.com/z43ds8bn/image/upload/v1795346894/Minimal_Premium_Login_Background_with_Girl_Child.png') center center / cover no-repeat fixed;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <a
    id="sb-forgot-password"
    href="/forgot-password"
    target="_top"
    style="position:fixed;right:18px;bottom:18px;z-index:99999;display:none;align-items:center;gap:8px;padding:11px 14px;border-radius:999px;background:#071f49;color:#fff;text-decoration:none;font:600 13px/1.2 Arial,Helvetica,sans-serif;box-shadow:0 10px 28px rgba(7,31,73,.28);border:1px solid rgba(255,255,255,.12);"
    aria-label="Forgot password"
  >
    <span style="width:8px;height:8px;border-radius:50%;background:#42c86b;flex:0 0 8px;"></span>
    Forgot password?
  </a>
  <script>
    (function () {
      var btn = document.getElementById("sb-forgot-password");
      if (!btn) return;
      function isAuthRoute() {
        var h = (location.hash || "").toLowerCase();
        var p = (location.pathname || "").toLowerCase();
        if (!h || h === "#" || h === "#/" || h === "#/login" || h === "#/signin" || h === "#/sign-in") return true;
        return /login|sign-?in|auth|forgot|reset|password/.test(h) || /login|sign-?in|auth|forgot|reset/.test(p);
      }
      function sync() { btn.style.display = isAuthRoute() ? "inline-flex" : "none"; }
      window.addEventListener("hashchange", sync);
      window.addEventListener("popstate", sync);
      setInterval(sync, 800);
      sync();
    })();
  </script>

  <script>
    if (
      "serviceWorker" in navigator &&
      (location.protocol === "https:" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1")
    ) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("flutter_service_worker.js", { scope: "./" })
          .catch(function () {});
      });
    }
  </script>
</body>
</html>
